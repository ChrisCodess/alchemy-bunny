name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Unit and lifecycle tests; the live suite skips without BUNNY_LIVE.
      - run: bun test
      # Build both packages and validate the tarballs (does not publish).
      - run: bun run pack
